name: ai-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the diff of this pull request against the base branch.
            Check layer rules in lib/AGENTS.md, scope lock, and test coverage.
            Post your findings as a single PR comment using gh pr comment, and keep it short.
            Do not approve or request changes through the API.
