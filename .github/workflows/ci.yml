name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - run: tool/coverage_check.sh
      - run: flutter test test/core/design_system test/features/example/presentation/view/article_list_golden_test.dart test/features/short_links/presentation/view/short_links_golden_test.dart
